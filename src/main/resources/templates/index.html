<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Task Manager - Projekt Kierunkowy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message {
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">Menedżer Zadań</h1>
            <span class="badge bg-light text-primary">Status: Aktywny</span>
        </div>
        <div class="card-body">

            <div class="mb-5 p-3 border rounded bg-white">
                <h5 class="card-title mb-3">Dodaj nowe zadanie</h5>
                <form th:action="@{/add}" th:object="${task}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Tytuł zadania</label>
                        <input type="text" th:field="*{title}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                               placeholder="Wpisz krótki tytuł..."/>
                        <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="invalid-feedback">
                            Błąd walidacji
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Opis zadania</label>
                        <textarea th:field="*{description}"
                                  class="form-control"
                                  rows="2"
                                  placeholder="Dodaj opcjonalny opis szczegółowy..."></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Dodaj do listy</button>
                    </div>
                </form>
            </div>

            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th style="width: 5%">ID</th>
                    <th style="width: 20%">Tytuł</th>
                    <th style="width: 35%">Opis</th>
                    <th style="width: 15%">Status</th>
                    <th style="width: 25%" class="text-end">Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.id}" class="text-muted small">1</td>
                    <td th:text="${t.title}" class="fw-bold">Przykładowe zadanie</td>
                    <td th:text="${t.description}" class="text-muted small">Opis zadania pojawi się tutaj</td>

                    <td>
                        <span th:class="${t.completed} ? 'badge bg-success' : 'badge bg-secondary'"
                              th:text="${t.completed ? 'Wykonane' : 'W toku'}">
                        </span>
                    </td>

                    <td class="text-end">
                        <div class="btn-group">
                            <form th:action="@{/toggle/{id}(id=${t.id})}" method="post" style="display:inline;">
                                <button type="submit"
                                        class="btn btn-sm"
                                        th:classappend="${t.completed} ? 'btn-outline-secondary' : 'btn-outline-success'">
                                    <span th:text="${t.completed} ? 'Cofnij' : 'Zakończ'"></span>
                                </button>
                            </form>

                            <a th:href="@{/edit/{id}(id=${t.id})}"
                               class="btn btn-sm btn-outline-warning">Edytuj</a>

                            <form th:action="@{/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${t.id}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Czy na pewno chcesz usunąć to zadanie?')">Usuń</button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        Brak zadań na liście. Dodaj coś powyżej!
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
